<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2" />
      <stop offset="45%" stop-color="#FF00FF" />
      <stop offset="80%" stop-color="#FF1493" />
      <stop offset="100%" stop-color="#FF6B6B" />
      <animate attributeName="x1" values="0%;100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%" dur="6s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="shine" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a8a8a" />
      <stop offset="30%" stop-color="#e8e8e8" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#d0d0d0" />
      <stop offset="100%" stop-color="#6f6f6f" />
      <animate attributeName="x1" values="-100%;200%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;300%" dur="3s" repeatCount="indefinite" />
